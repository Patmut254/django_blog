{% if page.has_other_pages %}
<nav class="pager" aria-label="Pagination">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}"><i class="fa fa-angle-left"></i> Prev</a>{% endif %}
  {% for n in page.paginator.page_range %}
    {% if n == page.number %}<span class="current">{{ n }}</span>{% else %}<a href="?page={{ n }}">{{ n }}</a>{% endif %}
  {% endfor %}
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}">Next <i class="fa fa-angle-right"></i></a>{% endif %}
</nav>
{% endif %}
